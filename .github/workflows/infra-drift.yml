name: Infra drift check

# deploy.yml skips `Apply Bicep` when a push changed no infrastructure, which
# takes ~3m off a typical release. The cost of that is drift: an app setting or
# firewall rule changed by hand in the portal would otherwise persist until the
# next infra commit, which could be months.
#
# **The SCHEDULED run REPORTS drift; it does not apply it.** It used to run a
# full `az deployment group create` every Sunday, and that cost a production
# restart every week whether or not anything had actually drifted — with a
# failed one about as often as not:
#
#   2026-08-02 20:06-20:11 drift run -> ContainerStartupFailure at 20:09:48
#   2026-08-09 19:25-19:30 drift run -> ContainerStartupFailure at 19:28:50
#
# Both are the same shape in the container log: "Shutting down: Master" and
# "Site container: inspro-portal terminated during site startup" — a second
# bounce cancelling a startup still in its ~45s warm-up, because re-applying the
# template PUTs `Microsoft.Web/sites` *and* its diagnostic settings *and* the
# role assignments in one deployment. The site self-heals (the smoke test below
# passed both times, ~90s later), so this was a brief 03:00-Monday-SGT blip
# rather than an outage — but it was a weekly self-inflicted one.
#
# And it bought nothing, because there was no drift to correct. A `what-if` on
# an untouched environment reports "14 to modify", all of it ARM noise: for the
# web app it lists `ftpsState`, `healthCheckPath`, `localMySqlEnabled`,
# `minTlsVersion` and `netFrameworkVersion` as ADDITIONS on every single run,
# because the provider does not return them on GET so what-if cannot see they
# are already set. `healthCheckPath` is live and correct in prod right now.
#
# That noise is also why this does not fail the run when what-if reports
# changes: it would be red every week for phantom diffs, and an alert that cries
# wolf weekly is worse than none. The diff goes to the job summary instead —
# read it for anything OUTSIDE that known-noise set, which is what real drift
# looks like. Correcting it is then one deliberate click:
# `workflow_dispatch` -> mode=apply.

on:
  schedule:
    # 19:00 UTC Sunday = 03:00 Monday in Singapore — outside working hours.
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "what-if (preview only) or apply"
        required: true
        default: what-if
        type: choice
        options: [what-if, apply]

# Read-only by default. Only the job that signs in to Azure adds
# `id-token: write`, as in deploy.yml.
permissions:
  contents: read

env:
  PROD_RG: rg-inspro-prod
  PROD_APP: inspro-portal
  # Public base URL for app smoke checks. Set the repository variable to the
  # platform host before turning on the Front Door origin lock, which makes
  # the raw azurewebsites.net hostname answer 403.
  PROD_APP_URL: ${{ vars.INSPRO_PROD_APP_URL || 'https://inspro-portal.azurewebsites.net' }}
  PROD_WORKER: inspro-portal-review-worker
  PROD_KV: inspro-prod-kv
  REGISTRY: insproacr.azurecr.io

# Never let this collide with a real deploy — both run `az deployment group
# create` against the same resource group, and ARM rejects concurrent
# deployments touching the same resources.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  drift:
    name: Re-assert prod infrastructure
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # CRITICAL: main.bicep requires `containerImage`, and whatever is passed
      # becomes the running container. Passing a placeholder or a stale tag here
      # would silently ROLL PRODUCTION BACK to that image. Read the tag the app
      # is actually serving and feed it straight back, so this deployment is
      # genuinely a no-op for the container.
      - name: Read the currently deployed image
        id: img
        run: |
          CURRENT=$(az webapp config show --name "${{ env.PROD_APP }}" \
            --resource-group "${{ env.PROD_RG }}" --query linuxFxVersion -o tsv | tr -d '\r')
          IMAGE="${CURRENT#DOCKER|}"
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "$CURRENT" ]; then
            echo "::error::Could not parse the running image from linuxFxVersion='${CURRENT}'."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Running image: $IMAGE"

      # The SCHEDULE never applies — see the header. `create` is reachable only
      # by someone choosing it on a manual dispatch, so nothing touches prod on
      # a timer.
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=what-if
          else
            MODE="${{ github.event.inputs.mode || 'what-if' }}"
          fi
          # The next step treats anything but what-if as `create`, so only the
          # two known modes get past here.
          case "$MODE" in
            what-if|apply) ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          # A dispatch from another branch would apply that branch's template
          # to prod. Only main's infrastructure is ever applied.
          if [ "$MODE" = apply ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::apply only from main"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE (event: ${{ github.event_name }})"

      - name: Keep Key Vault reachable from App Service
        if: steps.mode.outputs.mode != 'what-if'
        run: |
          set -euo pipefail
          POSSIBLE_IPS=$(az webapp show \
            --name "$PROD_APP" \
            --resource-group "$PROD_RG" \
            --query possibleOutboundIpAddresses -o tsv)
          [ -n "$POSSIBLE_IPS" ] || { echo "::error::App Service returned no outbound IPs"; exit 1; }
          IFS=',' read -r -a APP_IPS <<< "$POSSIBLE_IPS"
          az keyvault network-rule add \
            --name "$PROD_KV" \
            --ip-address "${APP_IPS[@]}" \
            --output none

      - name: Apply or preview
        id: run
        env:
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID_PROD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          CONTAINER_IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          DEPLOYMENT_NAME="drift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BICEP_ARGS=(
            --resource-group "$PROD_RG"
            --template-file infra/bicep/main.bicep
            --parameters @infra/bicep/parameters.prod.json
            --parameters
              "entraTenantId=$ENTRA_TENANT_ID"
              "entraClientId=$ENTRA_CLIENT_ID"
              "acrLoginServer=$REGISTRY"
              "containerImage=$CONTAINER_IMAGE"
              "smtpHost=$SMTP_HOST"
              "smtpUser=$SMTP_USER"
              "smtpFrom=$SMTP_FROM"
              "alertEmail=$ALERT_EMAIL"
          )
          # `--output none` on validate and create: this repository's Actions
          # logs are public, and their result JSON echoes every parameter value
          # and template output. Errors and warnings go to stderr, so they still
          # reach the log and the diagnostics artifact below.
          az deployment group validate \
            --name "${DEPLOYMENT_NAME}-validate" \
            "${BICEP_ARGS[@]}" --output none 2>&1 | tee /tmp/drift-validate.txt
          if [ "$MODE" = "what-if" ]; then
            echo "Running az deployment group what-if"
            # The raw result stays in a file that is neither printed nor
            # uploaded: what-if reports property VALUES, and both apps' app
            # settings carry the App Insights connection string. The report
            # below names every changed property but withholds the values under
            # app settings, connection strings and secret-named properties.
            az deployment group what-if \
              --name "$DEPLOYMENT_NAME" \
              "${BICEP_ARGS[@]}" --no-pretty-print --output json \
              2>&1 >/tmp/whatif-result.json | tee /tmp/drift-whatif-errors.txt
            python3 - /tmp/whatif-result.json <<'PY' | tee /tmp/drift-output.txt
          import json
          import re
          import sys

          WITHHELD = re.compile(
              r"appSettings|connectionString|instrumentationKey|password|secret",
              re.IGNORECASE,
          )
          SYMBOL = {"Create": "+", "Delete": "-", "Modify": "~", "Array": "~",
                    "NoEffect": "x", "Deploy": "!", "Unsupported": "?"}


          def shown(value, path):
              if value is None:
                  return "null"
              if WITHHELD.search(path):
                  if isinstance(value, list):
                      return f"[{len(value)} entries, values withheld]"
                  return "(value withheld)"
              text = json.dumps(value, sort_keys=True)
              return text if len(text) <= 160 else text[:157] + "..."


          def properties(deltas, parent, out):
              for delta in deltas or []:
                  path = f"{parent}.{delta['path']}" if parent else delta["path"]
                  if delta.get("children"):
                      properties(delta["children"], path, out)
                      continue
                  kind = delta.get("propertyChangeType")
                  before = shown(delta.get("before"), path)
                  after = shown(delta.get("after"), path)
                  change = {"Create": after, "Delete": before}.get(kind, f"{before} => {after}")
                  out.append(f"    {SYMBOL.get(kind, '~')} {path}: {change}")


          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          lines, unchanged = [], 0
          for resource in result.get("changes") or []:
              kind = resource.get("changeType")
              if kind in ("NoChange", "Ignore"):
                  unchanged += 1
                  continue
              # Relative to the resource group, so no subscription id is printed.
              name = re.sub(r"^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/", "",
                            resource.get("resourceId") or "", flags=re.IGNORECASE)
              lines.append(f"{SYMBOL.get(kind, '?')} {name} ({kind})")
              if resource.get("unsupportedReason"):
                  lines.append(f"    unsupported: {resource['unsupportedReason']}")
              properties(resource.get("delta"), "", lines)
          print("Resource and property changes (values under app settings, connection")
          print("strings and secret-named properties withheld):")
          print("\n".join(lines) if lines else "(none)")
          print(f"{unchanged} resource(s) unchanged or ignored.")
          PY
          else
            echo "Running az deployment group create"
            az deployment group create \
              --name "$DEPLOYMENT_NAME" \
              "${BICEP_ARGS[@]}" --output none 2>&1 | tee /tmp/drift-output.txt
          fi

      - name: Preserve Azure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/drift-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Refresh Key Vault references
        if: steps.mode.outputs.mode != 'what-if'
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          for APP in "$PROD_APP" "$PROD_WORKER"; do
            BASE="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${PROD_RG}/providers/Microsoft.Web/sites/${APP}/config/configreferences/appsettings"
            az rest --method post --uri "${BASE}/refresh?api-version=2022-03-01" --output none
            for ATTEMPT in {1..12}; do
              UNRESOLVED=$(az rest --method get \
                --uri "${BASE}?api-version=2022-03-01" \
                --query "length(value[?properties.status!='Resolved'])" -o tsv)
              if [ "$UNRESOLVED" = "0" ]; then
                echo "$APP: all Key Vault references resolved"
                break
              fi
              if [ "$ATTEMPT" = "12" ]; then
                echo "::error::$APP has $UNRESOLVED unresolved Key Vault reference(s)"
                exit 1
              fi
              sleep 5
            done
          done

      # A green run nobody opens tells nobody anything, so the diff goes where
      # it is visible without digging through logs.
      - name: Publish the diff to the run summary
        if: always() && steps.mode.outputs.mode == 'what-if'
        run: |
          {
            echo "## Prod infrastructure drift — preview only, nothing was changed"
            echo
            echo "ARM reports several properties as additions on EVERY run because"
            echo "the provider does not return them on GET. Known noise, safe to ignore:"
            echo '`ftpsState`, `healthCheckPath`, `localMySqlEnabled`, `minTlsVersion`,'
            echo '`netFrameworkVersion`, and `retentionPolicy.days` on diagnostic settings.'
            echo
            echo "**Anything else is real drift** — re-run this workflow with"
            echo "\`mode=apply\` to correct it. Values under app settings and connection"
            echo "strings are withheld; a changed setting is named by its path."
            echo
            echo '```'
            # `always()` means this also runs when the what-if itself failed, so
            # the file may be absent or empty — say so rather than failing the
            # summary step and masking the real error above. The file holds the
            # redacted report only, never the raw what-if result.
            if [ -s /tmp/drift-output.txt ]; then
              head -200 /tmp/drift-output.txt
            else
              echo "(no what-if output — the preview step failed; see its log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only meaningful after a real apply — a what-if never touches the site.
      # Applying CAN restart it (that is the whole reason the schedule no longer
      # does), so prove it came back rather than trusting a green deployment.
      - name: Smoke-test prod
        if: steps.mode.outputs.mode != 'what-if'
        run: |
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors \
            "${{ env.PROD_APP_URL }}/health"
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors \
            "${{ env.PROD_APP_URL }}/readiness"
