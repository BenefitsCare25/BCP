name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: insproacr.azurecr.io
  IMAGE_NAME: inspro-api
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  PROD_RG: rg-inspro-prod
  PROD_APP: inspro-portal
  PROD_WORKER: inspro-portal-review-worker
  PROD_PG: inspro-prod-pg

# There is deliberately no staging environment — prod is the only deployment
# target. That makes `test` the sole gate before a release reaches members, so
# it must stay green and must not be bypassed. Reintroducing a pre-prod
# environment means re-adding a job here plus infra/bicep/parameters.staging.json.
jobs:
  # ── CI gate: runs on every PR + push to main ────────────────────────────────
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — ruff
        working-directory: backend
        run: uv run ruff check app tests scripts

      - name: Backend dependency audit
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes --output-file requirements-audit.txt
          uv run pip-audit --requirement requirements-audit.txt

      - name: Backend — pytest
        working-directory: backend
        run: PYTHONPATH=. uv run pytest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend — install (frozen)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend — typecheck + build
        working-directory: frontend
        run: pnpm build

      - name: Frontend dependency audit
        working-directory: frontend
        run: pnpm audit --prod

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend end-to-end
        working-directory: frontend
        timeout-minutes: 10
        run: pnpm exec playwright test e2e/benefit-year-context.spec.ts

  # ── Non-gating static checks, deliberately OFF the critical path ───────────
  # mypy is `continue-on-error` and Bicep validation is re-proved by the actual
  # `az deployment group create` later, so neither should sit in front of a
  # release. Kept as a separate job so failures stay visible on the run.
  static-checks:
    name: Static checks (non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — mypy (strict)
        working-directory: backend
        run: uv run mypy app
        # mypy strict surfaces a lot on a half-typed codebase. Don't gate
        # merges on it yet — TODO: flip to required once the type debt is
        # paid down.
        continue-on-error: true

      - name: Validate Bicep
        run: az bicep build --file infra/bicep/main.bicep

  # ── Build + push the prod container ────────────────────────────────────────
  # The SPA is baked into the image (single-host deployment — see
  # backend/app/core/spa.py) and Vite inlines env at build time, so the Entra
  # client ID is a build arg and the image is environment-specific.
  build:
    name: Build container
    # Deliberately NOT `needs: test`. The image is inert until `deploy-prod`
    # ships it, and that job DOES gate on the tests — so building in parallel
    # takes ~90s off every release in exchange for occasionally building an
    # image for a commit that then fails its tests, which costs a few cheap ACR
    # minutes and is never deployed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name $(echo "${{ env.REGISTRY }}" | cut -d. -f1)

      # Build context is the repo root so the frontend can be built into the
      # same image as the API.
      - name: Build + push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_TENANT_MODE=header \
            --build-arg VITE_ENTRA_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ secrets.ENTRA_CLIENT_ID_PROD }}" \
            .
          docker run --rm --entrypoint python "$IMAGE" -c \
            "from app.services.claims_ai_confidence import load_confidence_profile; load_confidence_profile()"
          docker push "$IMAGE"

  # ── Production ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to prod
    # Gates on BOTH: `build` only proves an image exists, `test` is the sole
    # quality gate before a release reaches members (there is no staging).
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: prod
    # Serialise deploys. Two pushes in quick succession would otherwise run two
    # `alembic upgrade head` processes against the SAME production database at
    # once, and would race on the single-IP runner firewall rule — one job's
    # `always()` revoke deleting the rule the other job is still migrating
    # through.
    #
    # Scoped to this job, NOT the workflow: a workflow-level group would also
    # queue every pull request's `test` run behind unrelated deploys.
    #
    # `cancel-in-progress: false` is deliberate. Cancelling mid-deploy could
    # interrupt a migration or skip the revoke step, leaving the database
    # firewall open. Queue instead — a deploy is minutes, not hours.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Most releases change only application code, yet reconciling all ~20
      # Azure resources costs ~3m and opening the migration firewall rule costs
      # another ~1m40s — a full Postgres server update to admit one IP. Skipping
      # those when nothing relevant changed is the single biggest saving in this
      # pipeline.
      #
      # Uses the compare API rather than `git diff` so it works for a push of any
      # number of commits without a full-history checkout (which would cost back
      # what this saves). FAILS OPEN: anything unexpected — a force push, a new
      # branch, an API error, a manual dispatch — runs the full pipeline. A
      # deploy that cannot prove a migration is unnecessary must run it.
      - name: Detect what changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          INFRA=true
          MIGRATIONS=true
          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if FILES=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
                        --paginate --jq '.files[].filename' 2>/dev/null); then
              # The workflow itself counts as infra: it passes the parameters
              # that main.bicep is deployed with.
              echo "$FILES" | grep -qE '^(infra/|\.github/workflows/)' && INFRA=true || INFRA=false
              echo "$FILES" | grep -q '^backend/alembic/versions/' && MIGRATIONS=true || MIGRATIONS=false
            fi
          fi
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA  migrations=$MIGRATIONS"

      - name: Azure login (OIDC)
        id: login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploys IN PLACE — no slot swap. Deployment slots need Standard tier or
      # higher and this runs on Basic (B2), so a release is a container restart
      # of ~1-2 min. Rollback = re-run `az webapp config container set` with the
      # previous image tag (see docs/DEPLOY_RUNBOOK.md).
      # main.bicep requires `containerImage`, and whatever it is given becomes
      # the running container. Feeding it the CURRENT tag rather than the new one
      # keeps this template from shipping code as a side effect of an
      # infrastructure change — which used to put the new image live BEFORE
      # migrations ran, briefly serving new code against the old schema. The
      # `Deploy image` step below is now the single place a release ships, so the
      # order is always: infra -> migrate -> code.
      - name: Read the currently deployed image
        id: img
        if: steps.changed.outputs.infra == 'true'
        run: |
          NEW="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          CURRENT=$(az webapp config show --name "${{ env.PROD_APP }}" \
            --resource-group "${{ env.PROD_RG }}" --query linuxFxVersion -o tsv 2>/dev/null | tr -d '\r' || true)
          IMAGE="${CURRENT#DOCKER|}"
          # Fall back to the new tag when there is nothing running yet (first
          # deploy) or the value doesn't parse — better to ship early than to
          # fail the deployment on a cosmetic read.
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "$CURRENT" ]; then
            echo "No parseable running image; using the new tag."
            IMAGE="$NEW"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Bicep will assert image: $IMAGE"

      # Skipped when no infra changed. `Deploy image` below sets the container
      # tag in 10s, so the image still ships — this template's only other job on
      # a code-only release is to re-assert state that is already correct.
      # Drift is caught by the weekly infra-drift.yml run.
      - name: Apply Bicep to prod (idempotent)
        if: steps.changed.outputs.infra == 'true'
        run: |
          az deployment group create \
            --resource-group ${{ env.PROD_RG }} \
            --template-file infra/bicep/main.bicep \
            --parameters @infra/bicep/parameters.prod.json \
            --parameters \
              entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
              entraClientId="${{ secrets.ENTRA_CLIENT_ID_PROD }}" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD_PROD }}" \
              portalJwtSecret="${{ secrets.PORTAL_JWT_SECRET_PROD }}" \
              aiKeyEncryptionKey="${{ secrets.AI_KEY_ENCRYPTION_KEY_PROD }}" \
              acrLoginServer="${{ env.REGISTRY }}" \
              containerImage="${{ steps.img.outputs.image }}" \
              smtpHost="${{ secrets.SMTP_HOST }}" \
              smtpUser="${{ secrets.SMTP_USER }}" \
              smtpFrom="${{ secrets.SMTP_FROM }}" \
              smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
              alertEmail="${{ secrets.ALERT_EMAIL }}"

      # Applying the template PUTs `Microsoft.Web/sites`, which restarts the app.
      # `Deploy image` below then issues a SECOND restart moments later, and
      # landing that inside the first one's ~40s warm-up makes the platform
      # cancel the startup in flight:
      #
      #   Site container: inspro-portal terminated during site startup.
      #   State: Stopping, Action: CancellingStartup, LastError: ContainerStartupFailure
      #
      # Confirmed 3/3 — every run that applied the template (2026-08-02 and
      # 2026-08-09 drift, 2026-08-11 05:18 deploy) logged it, while the deploy
      # 90 minutes earlier that SKIPPED the apply started cleanly in 42.6s.
      #
      # **This does NOT eliminate the failure, and measuring it is how we know.**
      # The 2026-08-11 05:27 deploy — the first with this step — still logged one
      # at 05:30:36, i.e. INSIDE `az deployment group create` and before this
      # step began at 05:31:07: applying the template bounces the site more than
      # once on its own, which nothing here can reach. What this step does fix is
      # the compounding: that run's final restart came up clean (`LastError`
      # empty, 44.2s probe) instead of ending still carrying the error, because
      # the image restart no longer lands on top of an unfinished one.
      #
      # So the residual is one self-healing failed startup per INFRA-touching
      # deploy, gated by `Smoke-test prod`. The weekly unattended occurrence is
      # gone for a different reason — infra-drift.yml no longer applies on a
      # schedule.
      #
      # The fixed wait is deliberate. `curl` alone would return 200 instantly
      # from the OLD container, which is still serving while the platform gets
      # around to recycling it — so a bare health poll proves nothing. Sleep
      # first so the restart has actually begun, THEN wait for it to finish.
      #
      # Non-fatal: `Smoke-test prod` at the end is the real gate, and failing
      # here would abort a release whose image has not even shipped yet.
      - name: Let the Bicep restart settle before shipping the image
        if: steps.changed.outputs.infra == 'true'
        run: |
          sleep 45
          curl -fsS --connect-timeout 5 --max-time 10 \
            --retry 40 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health" \
            || echo "::warning::Site not healthy after the Bicep restart; continuing — Smoke-test prod is the gate."

      # NOTE: there is deliberately no firewall-sync step any more. The app now
      # reaches Postgres over a private endpoint inside the VNet (provisioned by
      # the Bicep above), so no public IP allowlist has to be maintained. The
      # old sync enumerated ~44 App Service outbound IPs as individual rules,
      # which Azure applies one server-update at a time — ~20 minutes per deploy.
      # Run migrations on every release. Alembic is idempotent, and comparing
      # only the latest commit is unsafe after a failed deployment: a retry
      # commit may contain no migration file even though production never
      # applied the migration from the earlier commit.
      - name: Setup Python (for migrate)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      # Migrations run from this runner, not from inside the VNet, so the runner
      # needs its own temporary hole in the otherwise-empty public allowlist.
      # Removed again in `always()` below so a failed migration can't leave the
      # DB exposed.
      #
      # Applied as an ARM deployment, NOT `az postgres flexible-server
      # firewall-rule create`: that command's `--name` flag changed meaning
      # between CLI versions (server name -> rule name, plus a new required
      # `--server-name`), and when the runner image picked up the newer CLI this
      # step began failing with "the following arguments are required:
      # --server-name/-s" — silently skipping migrations AND the image deploy on
      # every prod release. See modules/ci-firewall-rule.bicep.
      - name: Allow runner IP on Postgres
        id: fw
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          echo "::add-mask::$IP"
          RULE="ci-runner-${{ github.run_id }}"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          az deployment group create \
            --resource-group ${{ env.PROD_RG }} \
            --name "ci-fw-${{ github.run_id }}" \
            --template-file infra/bicep/modules/ci-firewall-rule.bicep \
            --parameters \
              postgresName="${{ env.PROD_PG }}" \
              ruleName="$RULE" \
              allowedIp="$IP" \
            --query "properties.provisioningState" -o tsv

      - name: Run database migrations + provision tenant schemas
        working-directory: backend
        env:
          INSPRO_DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_ADMIN_USER }}:${{ secrets.POSTGRES_ADMIN_PASSWORD_PROD }}@inspro-prod-pg.postgres.database.azure.com:5432/inspro?sslmode=require
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          # alembic only touches `public`; sync each firm schema so additive
          # tenant-table columns (e.g. enrollment_windows.flex_*) land everywhere.
          uv run python -m scripts.provision_tenants

      # Sweeps EVERY ci-runner-* rule, not just this run's. A job that is
      # force-cancelled or times out can skip this step entirely and strand an
      # allowlisted public IP on a database holding members' health and claims
      # data. Deleting the whole family is safe because the job-level
      # concurrency group means only one deploy is ever in flight.
      #
      # `az rest` for the same CLI-flag-stability reason as the create above.
      # It polls: DELETE returns 202 Accepted and Azure drains it in the
      # background, so the rule stays ENFORCED until that completes — treating
      # the accept as "closed" would report a hole as sealed while it is open.
      # Runs on EVERY deploy, including ones that skipped the migration steps
      # entirely — it costs one GET (~2s) when there is nothing to revoke, and
      # that makes it the safety net that catches a rule stranded by an earlier
      # force-cancelled run. Gated on the login rather than on `fw` so a skipped
      # migration still gets the sweep, but a failed login doesn't false-alarm.
      - name: Revoke runner IP
        if: always() && steps.login.outcome == 'success'
        run: |
          BASE="https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.PROD_RG }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ env.PROD_PG }}/firewallRules"
          for name in $(az rest --method get --url "${BASE}?api-version=2024-08-01" \
              --query "value[?starts_with(name,'ci-runner-')].name" -o tsv 2>/dev/null | tr -d '\r' || true); do
            echo "Revoking ${name}"
            az rest --method delete --url "${BASE}/${name}?api-version=2024-08-01" --only-show-errors || true
          done
          LEFT=unknown
          for _ in $(seq 1 20); do
            LEFT=$(az rest --method get --url "${BASE}?api-version=2024-08-01" \
              --query "length(value[?starts_with(name,'ci-runner-')])" -o tsv 2>/dev/null | tr -d '\r' || echo unknown)
            [ "$LEFT" = "0" ] && break
            sleep 10
          done
          if [ "$LEFT" = "0" ]; then
            echo "All ci-runner-* rules revoked."
          else
            # Loud but non-fatal. Failing here would mislabel an otherwise
            # successful deploy, but staying silent would leave the production
            # database reachable from a public IP with nobody told.
            echo "::error::${LEFT} ci-runner-* firewall rule(s) may still be open on ${{ env.PROD_PG }} — verify and remove manually."
          fi

      - name: Deploy image
        run: |
          az webapp config container set \
            --name ${{ env.PROD_APP }} \
            --resource-group ${{ env.PROD_RG }} \
            --container-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az webapp config container set \
            --name ${{ env.PROD_WORKER }} \
            --resource-group ${{ env.PROD_RG }} \
            --container-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Smoke-test prod
        run: |
          # App Service keeps the previous container serving while it schedules
          # a recycle. Wait beyond the observed slowest application import so
          # this gate cannot pass against the old process or a new process that
          # is still booting and will fail shortly afterwards.
          sleep 120

          # /health proves the container booted; /readiness additionally proves
          # it can reach Postgres — which now means the private endpoint
          # resolved and the VNet integration is carrying traffic, so this is
          # the gate that catches a broken private DNS link.
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health"
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/readiness"
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_WORKER }}.azurewebsites.net/readyz"

          # Require a stable window after the first successful probe. This
          # catches delayed Gunicorn worker-boot failures that briefly leave the
          # platform health endpoint green.
          sleep 30
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health"
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_APP }}.azurewebsites.net/readiness"
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_WORKER }}.azurewebsites.net/readyz"
