name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: insproacr.azurecr.io
  IMAGE_NAME: inspro-api
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  PROD_RG: rg-inspro-prod
  PROD_APP: inspro-portal
  PROD_PG: inspro-prod-pg

# There is deliberately no staging environment — prod is the only deployment
# target. That makes `test` the sole gate before a release reaches members, so
# it must stay green and must not be bypassed. Reintroducing a pre-prod
# environment means re-adding a job here plus infra/bicep/parameters.staging.json.
jobs:
  # ── CI gate: runs on every PR + push to main ────────────────────────────────
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — ruff
        working-directory: backend
        run: uv run ruff check app tests scripts

      - name: Backend — mypy (strict)
        working-directory: backend
        run: uv run mypy app
        # mypy strict surfaces a lot on a half-typed codebase. Don't gate
        # merges on it yet — TODO: flip to required once the type debt is
        # paid down.
        continue-on-error: true

      - name: Backend — pytest
        working-directory: backend
        run: PYTHONPATH=. uv run pytest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend — install (frozen)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend — typecheck + build
        working-directory: frontend
        run: pnpm build

      - name: Validate Bicep
        run: az bicep build --file infra/bicep/main.bicep

  # ── Build + push the prod container ────────────────────────────────────────
  # The SPA is baked into the image (single-host deployment — see
  # backend/app/core/spa.py) and Vite inlines env at build time, so the Entra
  # client ID is a build arg and the image is environment-specific.
  build:
    name: Build container
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name $(echo "${{ env.REGISTRY }}" | cut -d. -f1)

      # Build context is the repo root so the frontend can be built into the
      # same image as the API.
      - name: Build + push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_TENANT_MODE=header \
            --build-arg VITE_ENTRA_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ secrets.ENTRA_CLIENT_ID_PROD }}" \
            .
          docker push "$IMAGE"

  # ── Production ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    # Serialise deploys. Two pushes in quick succession would otherwise run two
    # `alembic upgrade head` processes against the SAME production database at
    # once, and would race on the single-IP runner firewall rule — one job's
    # `always()` revoke deleting the rule the other job is still migrating
    # through.
    #
    # Scoped to this job, NOT the workflow: a workflow-level group would also
    # queue every pull request's `test` run behind unrelated deploys.
    #
    # `cancel-in-progress: false` is deliberate. Cancelling mid-deploy could
    # interrupt a migration or skip the revoke step, leaving the database
    # firewall open. Queue instead — a deploy is minutes, not hours.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploys IN PLACE — no slot swap. Deployment slots need Standard tier or
      # higher and this runs on Basic (B2), so a release is a container restart
      # of ~1-2 min. Rollback = re-run `az webapp config container set` with the
      # previous image tag (see docs/DEPLOY_RUNBOOK.md).
      - name: Apply Bicep to prod (idempotent)
        run: |
          az deployment group create \
            --resource-group ${{ env.PROD_RG }} \
            --template-file infra/bicep/main.bicep \
            --parameters @infra/bicep/parameters.prod.json \
            --parameters \
              entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
              entraClientId="${{ secrets.ENTRA_CLIENT_ID_PROD }}" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD_PROD }}" \
              portalJwtSecret="${{ secrets.PORTAL_JWT_SECRET_PROD }}" \
              aiKeyEncryptionKey="${{ secrets.AI_KEY_ENCRYPTION_KEY_PROD }}" \
              acrLoginServer="${{ env.REGISTRY }}" \
              containerImage="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              alertEmail="${{ secrets.ALERT_EMAIL }}"

      # NOTE: there is deliberately no firewall-sync step any more. The app now
      # reaches Postgres over a private endpoint inside the VNet (provisioned by
      # the Bicep above), so no public IP allowlist has to be maintained. The
      # old sync enumerated ~44 App Service outbound IPs as individual rules,
      # which Azure applies one server-update at a time — ~20 minutes per deploy.
      - name: Setup Python (for migrate)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      # Migrations run from this runner, not from inside the VNet, so the runner
      # needs its own temporary hole in the otherwise-empty public allowlist.
      # Removed again in `always()` below so a failed migration can't leave the
      # DB exposed.
      #
      # Applied as an ARM deployment, NOT `az postgres flexible-server
      # firewall-rule create`: that command's `--name` flag changed meaning
      # between CLI versions (server name -> rule name, plus a new required
      # `--server-name`), and when the runner image picked up the newer CLI this
      # step began failing with "the following arguments are required:
      # --server-name/-s" — silently skipping migrations AND the image deploy on
      # every prod release. See modules/ci-firewall-rule.bicep.
      - name: Allow runner IP on Postgres
        id: fw
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          echo "::add-mask::$IP"
          RULE="ci-runner-${{ github.run_id }}"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          az deployment group create \
            --resource-group ${{ env.PROD_RG }} \
            --name "ci-fw-${{ github.run_id }}" \
            --template-file infra/bicep/modules/ci-firewall-rule.bicep \
            --parameters \
              postgresName="${{ env.PROD_PG }}" \
              ruleName="$RULE" \
              allowedIp="$IP" \
            --query "properties.provisioningState" -o tsv

      - name: Run database migrations + provision tenant schemas
        working-directory: backend
        env:
          INSPRO_DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_ADMIN_USER }}:${{ secrets.POSTGRES_ADMIN_PASSWORD_PROD }}@inspro-prod-pg.postgres.database.azure.com:5432/inspro?sslmode=require
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          # alembic only touches `public`; sync each firm schema so additive
          # tenant-table columns (e.g. enrollment_windows.flex_*) land everywhere.
          uv run python -m scripts.provision_tenants

      # Sweeps EVERY ci-runner-* rule, not just this run's. A job that is
      # force-cancelled or times out can skip this step entirely and strand an
      # allowlisted public IP on a database holding members' health and claims
      # data. Deleting the whole family is safe because the job-level
      # concurrency group means only one deploy is ever in flight.
      #
      # `az rest` for the same CLI-flag-stability reason as the create above.
      # It polls: DELETE returns 202 Accepted and Azure drains it in the
      # background, so the rule stays ENFORCED until that completes — treating
      # the accept as "closed" would report a hole as sealed while it is open.
      - name: Revoke runner IP
        if: always() && steps.fw.outputs.rule != ''
        run: |
          BASE="https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.PROD_RG }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ env.PROD_PG }}/firewallRules"
          for name in $(az rest --method get --url "${BASE}?api-version=2024-08-01" \
              --query "value[?starts_with(name,'ci-runner-')].name" -o tsv 2>/dev/null | tr -d '\r' || true); do
            echo "Revoking ${name}"
            az rest --method delete --url "${BASE}/${name}?api-version=2024-08-01" --only-show-errors || true
          done
          LEFT=unknown
          for _ in $(seq 1 20); do
            LEFT=$(az rest --method get --url "${BASE}?api-version=2024-08-01" \
              --query "length(value[?starts_with(name,'ci-runner-')])" -o tsv 2>/dev/null | tr -d '\r' || echo unknown)
            [ "$LEFT" = "0" ] && break
            sleep 10
          done
          if [ "$LEFT" = "0" ]; then
            echo "All ci-runner-* rules revoked."
          else
            # Loud but non-fatal. Failing here would mislabel an otherwise
            # successful deploy, but staying silent would leave the production
            # database reachable from a public IP with nobody told.
            echo "::error::${LEFT} ci-runner-* firewall rule(s) may still be open on ${{ env.PROD_PG }} — verify and remove manually."
          fi

      - name: Deploy image
        run: |
          az webapp config container set \
            --name ${{ env.PROD_APP }} \
            --resource-group ${{ env.PROD_RG }} \
            --docker-custom-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Smoke-test prod
        run: |
          # /health proves the container booted; /readiness additionally proves
          # it can reach Postgres — which now means the private endpoint
          # resolved and the VNet integration is carrying traffic, so this is
          # the gate that catches a broken private DNS link.
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health"
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/readiness"
