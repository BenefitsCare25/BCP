name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: insproacr.azurecr.io
  IMAGE_NAME: inspro-api
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  PROD_RG: rg-inspro-prod
  PROD_APP: inspro-portal
  PROD_WORKER: inspro-portal-review-worker
  PROD_PG: inspro-prod-pg-recovery-20260825
  PROD_KV: inspro-prod-kv

# There is deliberately no staging environment — prod is the only deployment
# target. That makes CI and static validation the gates before a release reaches
# members, so they must stay green and must not be bypassed. Reintroducing a pre-prod
# environment means re-adding a job here plus infra/bicep/parameters.staging.json.
jobs:
  # Classify the diff once so unrelated stacks do not hold up a release. Any
  # compare failure fails open and runs every gate.
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          BACKEND=true
          FRONTEND=true
          INFRA=true
          BASE=""
          HEAD="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ -n "$BEFORE" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          fi

          if [ -n "$BASE" ] && \
             FILES=$(gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD}" \
                       --paginate --jq '.files[].filename' 2>/dev/null); then
            BACKEND=false
            FRONTEND=false
            INFRA=false
            echo "$FILES" | grep -qE '^(backend/|\.dockerignore$)' && BACKEND=true || true
            echo "$FILES" | grep -q '^frontend/' && FRONTEND=true || true
            echo "$FILES" | grep -q '^infra/' && INFRA=true || true
            if echo "$FILES" | grep -q '^\.github/workflows/deploy\.yml$'; then
              BACKEND=true
              FRONTEND=true
              INFRA=true
            fi
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND  frontend=$FRONTEND  infra=$INFRA"

  # ── CI gate: runs on every PR + push to main ────────────────────────────────
  backend-test:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — ruff
        working-directory: backend
        run: uv run ruff check app tests scripts

      - name: Backend dependency audit
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes --output-file requirements-audit.txt
          uv run pip-audit --requirement requirements-audit.txt

      - name: Backend — pytest
        working-directory: backend
        run: PYTHONPATH=. uv run pytest

  frontend-test:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Playwright starts FastAPI and prepares an Alembic database, so the
      # backend environment is required even for a UI-only change.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend install for end-to-end
        working-directory: backend
        run: uv sync --frozen

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend — install (frozen)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend — typecheck + build
        working-directory: frontend
        run: pnpm build

      - name: Frontend dependency audit
        working-directory: frontend
        run: pnpm audit --prod

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend end-to-end
        working-directory: frontend
        timeout-minutes: 10
        run: pnpm exec playwright test

  # Preserve the established required-check name while the independent stacks
  # execute in parallel. A skipped stack is valid; a failed classifier or stack
  # is not.
  test:
    name: Lint + test
    needs: [changes, backend-test, frontend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change classification ended with $CHANGES_RESULT."
            exit 1
          fi
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required CI job ended with $result."
              exit 1
            fi
          done

  # ── Static quality gate ────────────────────────────────────────────────────
  # Strict typing and infrastructure validation must both pass before release.
  static-checks:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — mypy (strict)
        working-directory: backend
        run: uv run mypy app

      - name: Validate Bicep
        if: needs.changes.outputs.infra == 'true'
        run: |
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build --file infra/bicep/migration-job.bicep --stdout > /dev/null
          bash -n infra/scripts/run-private-migrations.sh

  # ── Build + push the prod container ────────────────────────────────────────
  # The SPA is baked into the image (single-host deployment — see
  # backend/app/core/spa.py) and Vite inlines env at build time, so the Entra
  # client ID is a build arg and the image is environment-specific.
  build:
    name: Build container
    # Deliberately NOT `needs: test`. The image is inert until `deploy-prod`
    # ships it, and that job gates on tests and static checks — so building in parallel
    # takes ~90s off every release in exchange for occasionally building an
    # image for a commit that then fails its tests, which costs a few cheap ACR
    # minutes and is never deployed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name $(echo "${{ env.REGISTRY }}" | cut -d. -f1)

      # Build context is the repo root so the frontend can be built into the
      # same image as the API.
      - name: Build + push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" \
            --build-arg INSPRO_GIT_SHA="${{ github.sha }}" \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_TENANT_MODE=header \
            --build-arg VITE_ENTRA_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ secrets.ENTRA_CLIENT_ID_PROD }}" \
            .
          docker run --rm --entrypoint python "$IMAGE" -c \
            "from app.services.claims_ai_confidence import load_confidence_profile; load_confidence_profile()"
          docker push "$IMAGE"

  # ── Production ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to prod
    # Gates on tests, strict typing, infrastructure validation and the image
    # build before a release reaches members (there is no staging).
    needs: [test, static-checks, build]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.result == 'success' &&
      (needs.static-checks.result == 'success' || needs.static-checks.result == 'skipped') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: prod
    # Serialise deploys. Two pushes in quick succession would otherwise run two
    # `alembic upgrade head` processes against the SAME production database at
    # once, and would race on the single private Container Apps migration job.
    #
    # Scoped to this job, NOT the workflow: a workflow-level group would also
    # queue every pull request's `test` run behind unrelated deploys.
    #
    # `cancel-in-progress: false` is deliberate. Cancelling mid-deploy could
    # interrupt a migration or skip the revoke step, leaving the database
    # firewall open. Queue instead — a deploy is minutes, not hours.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Most releases change only application code, yet reconciling all ~20
      # Azure resources costs ~3m, and running the private migration job adds
      # more startup time. Skipping those when nothing relevant changed is the
      # single biggest saving in this pipeline.
      #
      # Uses the compare API rather than `git diff` so it works for a push of any
      # number of commits without a full-history checkout (which would cost back
      # what this saves). FAILS OPEN: anything unexpected — a force push, a new
      # branch, an API error, a manual dispatch — runs the full pipeline. A
      # deploy that cannot prove a migration is unnecessary must run it.
      - name: Detect what changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          INFRA=true
          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if FILES=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
                        --paginate --jq '.files[].filename' 2>/dev/null); then
              # The private migration stack is provisioned independently. Workflow
              # changes still run every CI gate, but do not restart the live stack.
              echo "$FILES" | grep '^infra/' | \
                grep -vE '^infra/(bicep/migration-job\.(bicep|json)|scripts/run-private-migrations\.sh)$' \
                | grep -q . && INFRA=true || INFRA=false
            fi
          fi
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA"

      - name: Azure login (OIDC)
        id: login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Key Vault has a deny-by-default network firewall. Its versionless App
      # Service references are re-resolved whenever Bicep writes a new secret
      # version, so RBAC alone is not enough: the plan's outbound addresses must
      # also be allowed before the template touches those secrets. Use the full
      # possible set so a scale-unit move does not break the next cold start.
      - name: Keep Key Vault reachable from App Service
        run: |
          set -euo pipefail
          POSSIBLE_IPS=$(az webapp show \
            --name "$PROD_APP" \
            --resource-group "$PROD_RG" \
            --query possibleOutboundIpAddresses -o tsv)
          [ -n "$POSSIBLE_IPS" ] || { echo "::error::App Service returned no outbound IPs"; exit 1; }
          IFS=',' read -r -a APP_IPS <<< "$POSSIBLE_IPS"
          az keyvault network-rule add \
            --name "$PROD_KV" \
            --ip-address "${APP_IPS[@]}" \
            --output none

      # Deploys IN PLACE — no slot swap. Deployment slots need Standard tier or
      # higher and this runs on Basic (B2), so a release is a container restart
      # of ~1-2 min. Rollback = re-run `az webapp config container set` with the
      # previous image tag (see the production deployment operations section in
      # docs/PRODUCTION_RESILIENCE_RUNBOOK.md).
      # main.bicep requires `containerImage`, and whatever it is given becomes
      # the running container. Feeding it the CURRENT tag rather than the new one
      # keeps this template from shipping code as a side effect of an
      # infrastructure change — which used to put the new image live BEFORE
      # migrations ran, briefly serving new code against the old schema. The
      # `Deploy image` step below is now the single place a release ships, so the
      # order is always: infra -> migrate -> code.
      - name: Read the currently deployed image
        id: img
        run: |
          NEW="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          CURRENT=$(az webapp config show --name "${{ env.PROD_APP }}" \
            --resource-group "${{ env.PROD_RG }}" --query linuxFxVersion -o tsv 2>/dev/null | tr -d '\r' || true)
          IMAGE="${CURRENT#DOCKER|}"
          # Fall back to the new tag when there is nothing running yet (first
          # deploy) or the value doesn't parse — better to ship early than to
          # fail the deployment on a cosmetic read.
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "$CURRENT" ]; then
            echo "No parseable running image; using the new tag."
            IMAGE="$NEW"
          fi
          TAG="${IMAGE##*:}"
          if echo "$TAG" | grep -qE '^[0-9a-f]{40}$'; then
            echo "sha=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Bicep will assert image: $IMAGE"

      # Reconcile from the commit production is actually serving. If an earlier
      # infra apply failed, an event-only diff would let the next code-only push
      # skip the still-pending infrastructure change.
      - name: Detect pending infrastructure changes
        id: infra_pending
        env:
          BASE_SHA: ${{ steps.img.outputs.sha }}
          EVENT_INFRA: ${{ steps.changed.outputs.infra }}
        run: |
          INFRA="$EVENT_INFRA"
          if [ -z "$BASE_SHA" ]; then
            INFRA=true
          elif [ "$BASE_SHA" != "${{ github.sha }}" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 && \
               FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}"); then
              echo "$FILES" | grep '^infra/' | \
                grep -vE '^infra/(bicep/migration-job\.(bicep|json)|scripts/run-private-migrations\.sh)$' \
                | grep -q . && INFRA=true || true
            else
              # A compare failure must not hide infrastructure work.
              INFRA=true
            fi
          fi
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "production_sha=${BASE_SHA:-unknown}  pending_infra=$INFRA"

      # Compare from the image production is actually serving, not merely from
      # the previous push. If an earlier release failed before shipping its
      # image, this range still contains its unapplied migrations. Any failure
      # to prove the range safe runs migrations.
      - name: Detect pending database changes
        id: pending
        env:
          BASE_SHA: ${{ steps.img.outputs.sha }}
        run: |
          MIGRATIONS=true
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" = "${{ github.sha }}" ]; then
            MIGRATIONS=false
          elif [ -n "$BASE_SHA" ] && \
               git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 && \
               FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}"); then
            MIGRATIONS=false
            echo "$FILES" | grep -qE '^backend/(alembic(/|\.ini$)|app/models/|app/db/(tenancy|migration_helpers)\.py$|scripts/(provision_tenants|run_private_migrations)\.py$|app/services/claims_review/recovery\.py$)' \
              && MIGRATIONS=true || true
          fi
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "production_sha=${BASE_SHA:-unknown}  migrations=$MIGRATIONS"

      # Skipped when no infra changed. `Deploy image` below sets the container
      # tag in 10s, so the image still ships — this template's only other job on
      # a code-only release is to re-assert state that is already correct.
      # Drift is caught by the weekly infra-drift.yml run.
      - name: Apply Bicep to prod (idempotent)
        id: bicep
        if: steps.infra_pending.outputs.infra == 'true'
        env:
          # Routine infrastructure reconciliation intentionally receives no
          # application or database secrets. Key Vault values are immutable in
          # this path and bootstrapSecrets remains false.
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID_PROD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CONTAINER_IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BICEP_ARGS=(
            --resource-group "$PROD_RG"
            --template-file infra/bicep/main.bicep
            --parameters @infra/bicep/parameters.prod.json
            --parameters
              "entraTenantId=$ENTRA_TENANT_ID"
              "entraClientId=$ENTRA_CLIENT_ID"
              "acrLoginServer=$REGISTRY"
              "containerImage=$CONTAINER_IMAGE"
              "smtpHost=$SMTP_HOST"
              "smtpUser=$SMTP_USER"
              "smtpFrom=$SMTP_FROM"
          )
          az deployment group validate \
            --name "${DEPLOYMENT_NAME}-validate" \
            "${BICEP_ARGS[@]}" 2>&1 | tee /tmp/bicep-validate.log
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            "${BICEP_ARGS[@]}" 2>&1 | tee /tmp/bicep-create.log

      - name: Preserve Bicep failure diagnostics
        if: failure() && steps.infra_pending.outputs.infra == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bicep-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bicep-*.log
          if-no-files-found: warn
          retention-days: 14

      # App Service may cache a versionless Key Vault reference for up to 24
      # hours. Force a refresh after Bicep reconciles secret versions, and fail
      # before the image rollout if any reference still cannot be resolved.
      - name: Refresh Key Vault references
        if: steps.infra_pending.outputs.infra == 'true'
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          for APP in "$PROD_APP" "$PROD_WORKER"; do
            BASE="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${PROD_RG}/providers/Microsoft.Web/sites/${APP}/config/configreferences/appsettings"
            az rest --method post --uri "${BASE}/refresh?api-version=2022-03-01" --output none
            for ATTEMPT in {1..12}; do
              UNRESOLVED=$(az rest --method get \
                --uri "${BASE}?api-version=2022-03-01" \
                --query "length(value[?properties.status!='Resolved'])" -o tsv)
              if [ "$UNRESOLVED" = "0" ]; then
                echo "$APP: all Key Vault references resolved"
                break
              fi
              if [ "$ATTEMPT" = "12" ]; then
                echo "::error::$APP has $UNRESOLVED unresolved Key Vault reference(s)"
                exit 1
              fi
              sleep 5
            done
          done

      # Applying the template PUTs `Microsoft.Web/sites`, which restarts the app.
      # `Deploy image` below then issues a SECOND restart moments later, and
      # landing that inside the first one's ~40s warm-up makes the platform
      # cancel the startup in flight:
      #
      #   Site container: inspro-portal terminated during site startup.
      #   State: Stopping, Action: CancellingStartup, LastError: ContainerStartupFailure
      #
      # Confirmed 3/3 — every run that applied the template (2026-08-02 and
      # 2026-08-09 drift, 2026-08-11 05:18 deploy) logged it, while the deploy
      # 90 minutes earlier that SKIPPED the apply started cleanly in 42.6s.
      #
      # **This does NOT eliminate the failure, and measuring it is how we know.**
      # The 2026-08-11 05:27 deploy — the first with this step — still logged one
      # at 05:30:36, i.e. INSIDE `az deployment group create` and before this
      # step began at 05:31:07: applying the template bounces the site more than
      # once on its own, which nothing here can reach. What this step does fix is
      # the compounding: that run's final restart came up clean (`LastError`
      # empty, 44.2s probe) instead of ending still carrying the error, because
      # the image restart no longer lands on top of an unfinished one.
      #
      # So the residual is one self-healing failed startup per INFRA-touching
      # deploy, gated by `Smoke-test prod`. The weekly unattended occurrence is
      # gone for a different reason — infra-drift.yml no longer applies on a
      # schedule.
      #
      # The fixed wait is deliberate. `curl` alone would return 200 instantly
      # from the OLD container, which is still serving while the platform gets
      # around to recycling it — so a bare health poll proves nothing. Sleep
      # first so the restart has actually begun, THEN wait for it to finish.
      #
      # Non-fatal: `Smoke-test prod` at the end is the real gate, and failing
      # here would abort a release whose image has not even shipped yet.
      - name: Let the Bicep restart settle before shipping the image
        if: steps.infra_pending.outputs.infra == 'true'
        run: |
          sleep 45
          curl -fsS --connect-timeout 5 --max-time 10 \
            --retry 40 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health" \
            || echo "::warning::Site not healthy after the Bicep restart; continuing — Smoke-test prod is the gate."

      # Execute the tested release image inside the private production network.
      # No database credentials or temporary PostgreSQL firewall rules on GitHub.
      - name: Run private database migrations
        if: steps.pending.outputs.migrations == 'true'
        run: |
          ACCESS=$(az postgres flexible-server show -g "${{ env.PROD_RG }}" \
            -n "${{ env.PROD_PG }}" --query network.publicNetworkAccess -o tsv)
          [ "$ACCESS" = "Disabled" ] || { echo "::error::PostgreSQL must remain private-only"; exit 1; }
          bash infra/scripts/run-private-migrations.sh "${{ env.PROD_RG }}" \
            inspro-prod-migrate "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" "${{ github.sha }}"

      - name: Deploy image
        run: |
          az webapp config container set \
            --name ${{ env.PROD_APP }} \
            --resource-group ${{ env.PROD_RG }} \
            --container-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az webapp config container set \
            --name ${{ env.PROD_WORKER }} \
            --resource-group ${{ env.PROD_RG }} \
            --container-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Smoke-test prod
        run: |
          # App Service serves the old container while scheduling a recycle.
          # Wait for both endpoints to report the SHA baked into the new image,
          # which proves the rollout happened without a blind startup sleep.
          wait_for_version() {
            NAME="$1"
            URL="$2"
            # Cold image pulls on Basic tier can take several minutes while
            # the old container keeps serving. Allow ten minutes, but still
            # require the exact release SHA and the stable readiness window.
            for _ in $(seq 1 100); do
              HEADERS=$(curl -fsS --connect-timeout 3 --max-time 5 \
                -D - -o /dev/null "$URL" 2>/dev/null || true)
              VERSION=$(printf '%s\n' "$HEADERS" | awk \
                'tolower($1) == "x-inspro-version:" { gsub("\r", "", $2); print $2 }' \
                | tail -1)
              if [ "$VERSION" = "${{ github.sha }}" ]; then
                echo "$NAME is serving $VERSION."
                return 0
              fi
              echo "$NAME is serving ${VERSION:-no version yet}; waiting."
              sleep 5
            done
            echo "::error::$NAME did not serve ${{ github.sha }} before timeout."
            return 1
          }

          # Avoid probing during the short front-end route handoff; Azure's own
          # AlwaysOn probe recorded a transient 502 three seconds after the last
          # rollout even though the previous container was still healthy.
          sleep 15
          wait_for_version portal \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health" &
          PORTAL_PID=$!
          wait_for_version worker \
            "https://${{ env.PROD_WORKER }}.azurewebsites.net/readyz" &
          WORKER_PID=$!
          STATUS=0
          wait "$PORTAL_PID" || STATUS=1
          wait "$WORKER_PID" || STATUS=1
          [ "$STATUS" = "0" ] || exit "$STATUS"

          # /health proves the container booted; /readiness additionally proves
          # it can reach Postgres — which now means the private endpoint
          # resolved and the VNet integration is carrying traffic, so this is
          # the gate that catches a broken private DNS link.
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health"
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_APP }}.azurewebsites.net/readiness"
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://${{ env.PROD_WORKER }}.azurewebsites.net/readyz"

          # Require a stable window after the first successful probe. This
          # catches delayed Gunicorn worker-boot failures that briefly leave the
          # platform health endpoint green.
          sleep 30
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_APP }}.azurewebsites.net/health"
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_APP }}.azurewebsites.net/readiness"
          curl -fsS --connect-timeout 5 --max-time 15 \
            "https://${{ env.PROD_WORKER }}.azurewebsites.net/readyz"
