--warn-bg);color:var(--warn)}.badge.good{background:var(--good-bg);color:var(--good)}.badge.error{background:var(--brand-wash);color:var(--brand)}.tabs{display:flex;gap:25px;padding:0 24px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:none;padding:16px 0;color:var(--muted);font-size:13px;white-space:nowrap}.tab.active{border-bottom-color:var(--brand);color:var(--ink);font-weight:550}.tab span{margin-left:7px;color:var(--muted)}.pagination{padding:16px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.facts dt{font-size:12px;color:var(--muted);margin-bottom:5px}.facts dd{margin:0;font-size:14px;font-weight:500}.facts{margin:0}.note{padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted)}.note.info{background:var(--info-bg);color:var(--info);border-color:transparent}.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px}.doc-stage{background:var(--neutral);padding:28px;min-height:430px}.paper{background:var(--surface);padding:32px;border:1px solid var(--line);min-height:400px;font-size:12px}.paper h2{font-size:19px}.paper h3{margin-top:26px;font-size:13px}.paper table{margin-top:22px;white-space:normal}.paper td,.paper th{padding:11px 0;font-size:11px}.paper .total{margin-top:18px;text-align:right;font-size:16px}.dropzone{border:1px dashed var(--input);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 22px;background:var(--bg)}.dropzone p{font-weight:500;font-size:13px}.dropzone small{display:block;margin-top:3px}.check{width:17px;height:17px;accent-color:var(--brand);vertical-align:middle}.checklabel{display:flex;gap:12px;ali <body>
<div class="review"><div><strong>WICA design review</strong><span class="review-description"> · Proposed screens · Synthetic data · No live changes</span></div><div class="row review-tools"><label for="screen" class="review-only">Screen</label><select id="screen" aria-label="Review screen"></select><button class="btn quiet" data-action="reset">Reset demo</button></div></div>
<div class="app" id="app"><aside><div class="logo"><img src="__LOGO__" alt="Inspro Insurance Brokers"></div><nav class="nav" id="navigation" aria-label="Proposed broker navigation"></nav></aside><div class="shell"><header class="topbar"><div class="row"><button class="btn quiet mobile-toggle" data-action="menu" aria-label="Toggle navigation">Menu</button><div class="row company"><span id="company-icon"></span>Meridian Engineering<small>01 Jan – 31 Dec 2026</small></div></div><div class="row account"><span class="avatar">BR</span><span class="account-name">Broker reviewer</span></div></header><main class="main" id="main" tabindex="-1"></main></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const paths={home:'m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',boxes:'m12 3 9 5-9 5-9-5z M3 8v8l9 5 9-5V8 M12 13v8',calendar:'M4 5h16v16H4z M8 3v4 M16 3v4 M4 10h16',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.8',upload:'M12 16V3 m-5 5 5-5 5 5 M4 15v6h16v-6',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M9 12l2 2 4-4',file:'M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h6',chart:'M4 3v18h17 M8 16V9 M13 16V5 M18 16v-6',settings:'M4 7h16 M4 17h16 M8 4v6 M16 14v6',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',clinic:'M6 3v6a5 5 0 0 0 10 0V3 M4 3h4 M14 3h4 M11 14v2a5 5 0 0 0 10 0v-2 M21 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4',plus:'M12 5v14 M5 12h14',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',arrow:'M5 12h14 m-5-5 5 5-5 5',download:'M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5',building:'M5 21V3h10v18 M15 9h5v12 M8 7h4 M8 11h4 M8 15h4 M9 21v-3h3v3'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
const escapeHtml=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screens=[['incidents','01 · Incident register'],['new','02 · Create incident'],['documents','03 · Upload documents'],['tag','04 · Tag document'],['claim','05 · Claim & related documents'],['pack','06 · Select insurer files'],['pending','07 · Pending insurer approval'],['settlement','08 · Record settlement'],['settings','09 · Company settings / WICA']];
const docsInitial=[{name:'Medical bill 0891.pdf',type:'Medical Bill',benefit:'Medical',date:'2026-09-12',amount:'300.00',id:'WIC-00081'},{name:'Medical certificate.pdf',type:'Medical Certificate',benefit:'Others',date:'2026-09-12',id:''},{name:'Salary voucher — August.pdf',type:'Salary Voucher',benefit:'Others',date:'2026-08-31',id:''},{name:'MOM incident report.pdf',type:'MOM I-Report',benefit:'Others',date:'2026-09-13',id:''}];
let state,toastTimer;function reset(){state={screen:'incidents',docs:structuredClone(docsInitial),status:'Submitted',selectedDoc:0,selected:new Set([0,1,2,3]),sent:false,packVersion:0,settlement:null,inline:null,filter:'all',employee:'Tan Jun Wei',description:'Hand injury while handling materials at the workshop.',events:[]};render()};
const button=(label,action,kind='',ico='')=>`<button type="button" class="btn ${kind}" data-action="${action}">${ico?icon(ico):''}${label}</button>`;
const badge=(status)=>`<span class="badge ${status==='Settled'?'good':status==='Pending documents'||status==='Needs tagging'?'warn':status==='Pending insurer approval'?'info':status==='Rejected'?'error':''}">${escapeHtml(status)}</span>`;
const field=(label,control,full=false,hint='')=>`<label class="field ${full?'full':''}"><span>${label}</span>${control}${hint?`<small>${hint}</small>`:''}</label>`;
const input=(name,value,type='text',required=false)=>`<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${type==='number'?'min="0" step="0.01"':''} ${required?'required':''}>`;
const select=(name,values,current)=>`<select name="${name}">${values.map(v=>`<option ${v===current?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select>`;
const date=(s)=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const money=(v)=>'S$ '+Number(v).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const title=(h,sub,actions='')=>`<div class="heading"><div><h1>${h}</h1><p>${sub}</p></div><div class="row wrap">${actions}</div></div>`;
function navigation(){const groups=[['Client Relations',[['Company & Benefits','boxes'],['Enrollment','calendar']]],['Policy Admin',[['Member Listing','upload'],['Member Coverage','users'],['Panel & Clinics','clinic'],['Underwriting','shield']]],['Claims',[['Claims Review','file'],['WICA','shield','incidents'],['Reports Center','chart']]],['Settings',[['Company settings','settings','settings'],['AI Provider','spark']]]];document.querySelector('#navigation').innerHTML=`<button class="nav-item" data-action="existing">${icon('home')}Home</button>`+groups.map(([name,items])=>`<div class="nav-group"><p>${name}</p>${items.map(([label,ic,s])=>`<button class="nav-item ${s&&(s==='settings'?state.screen==='settings':state.screen!=='settings')?'active':''}" data-action="${s?'go:'+s:'existing'}">${icon(ic)}${label}${label==='WICA'?'<span class="new-dot" title="Proposed addition"></span>':''}</button>`).join('')}</div>`).join('')}
function crumb(){return `<div class="crumb"><span>${state.screen==='settings'?'Settings':'Claims'}</span><span>/</span><button data-action="go:incidents">${state.screen==='settings'?'Company settings':'WICA'}</button>${!['incidents','settings'].includes(state.screen)?`<span>/</span><span>${state.screen==='new'?'Create incident':'Incident WC-00042'}</span>`:''}</div>`}
function incidentFacts(){return `<div class="panel body"><dl class="facts"><div><dt>Incident date</dt><dd>12 Sep 2026</dd></div><div><dt>iReport number</dt><dd>IR-2026-0042</dd></div><div><dt>Insurer</dt><dd>Example Insurer</dd></div><div><dt>Policy number</dt><dd>WIC-DEMO-2026</dd></div></dl></div>`}
function footer(){const route=state.screen==='settings'?'/settings/company?tab=wica':state.screen==='incidents'?'/claims/wica':'/claims/wica/incidents/WC-00042';return `<div class="footer-note"><span>Proposed location: ${route}</span><span>Synthetic review data · Changes stay in this browser session</span></div>`}
function incidents(){const rows=[['WC-00042',state.employee,'12 Sep 2026','IR-2026-0042',state.status,1],['WC-00039','Priya Raman','08 Sep 2026','IR-2026-0039','Pending insurer approval',2],['WC-00035','Marcus Lee','01 Sep 2026','Not recorded','Pending documents',1],['WC-00028','Sofia Lim','17 Aug 2026','IR-2026-0028','Settled',2]];return title('WICA','Manage work injury incidents and insurer submissions.',button('Create incident','go:new','primary','plus'))+`<div class="panel"><div class="tabs"><button class="tab active" data-filter="all">All incidents <span>4</span></button><button class="tab" data-filter="open">Open <span>3</span></button><button class="tab" data-filter="closed">Closed <span>1</span></button></div><div class="toolbar"><div class="search">${icon('search')}<input id="search" placeholder="Search employee or incident reference" aria-label="Search incidents"></div><select id="period" aria-label="WICA period"><option>01 Jan – 31 Dec 2026</option><option>All periods</option></select></div><div class="table-wrap"><table><thead><tr><th>Incident / Employee</th><th>Incident date</th><th>iReport number</th><th>Claim status</th><th>Claims</th><th></th></tr></thead><tbody id="incident-rows">${rows.map((r,i)=>`<tr data-search="${r.join(' ').toLowerCase()}" data-closed="${r[4]==='Settled'}"><td><button class="link" data-action="open:${i}">${r[0]}</button><small>${escapeHtml(r[1])}</small></td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td>${badge(r[4])}</td><td class="num">${r[5]}</td><td><button class="link" data-action="open:${i}">Open ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div><div class="empty" id="empty" hidden>No matching incidents. Try another name or reference.</div><div class="pagination"><span id="row-count">4 incidents · Latest updated first</span><span>Page 1 of 1</span></div></div><div class="note gap">Each employee incident holds its own documents and claim IDs. Select an incident to prepare files for the insurer.</div>`}
function newIncident(){return title('Create incident','Start one record for one employee and incident.',button('Back to WICA','go:incidents','quiet'))+`<form id="new-form" class="panel narrow"><div class="section"><h2>Employee & policy</h2><div class="fields">${field('Employee <span class="required">*</span>',select('employee',['Tan Jun Wei · EMP-0108','Priya Raman · EMP-0162','Marcus Lee · EMP-0207'],'Tan Jun Wei · EMP-0108'))}${field('Insured entity',input('entity','Meridian Engineering Pte Ltd'))}${field('WICA period',select('period',['01 Jan – 31 Dec 2026'],'01 Jan – 31 Dec 2026'))}${field('Insurer / Policy',input('policy','Example Insurer / WIC-DEMO-2026'))}</div></div><div class="section"><h2>Incident details</h2><div class="fields">${field('Incident date <span class="required">*</span>',input('incidentDate','2026-09-12','date',true))}${field('MOM iReport number',input('ireport','IR-2026-0042'),false,'Optional. You can add it later.')}${field('What happened? <span class="required">*</span>','<textarea name="description" required>Hand injury while handling materials at the workshop.</textarea>',true)}</div></div><div class="form-footer">${button('Cancel','go:incidents','quiet')}<button type="submit" class="btn primary">Create incident ${icon('arrow')}</button></div></form>`}
function documents(){return title('Incident WC-00042',`${escapeHtml(state.employee)} · EMP-0108 · Meridian Engineering`,button('All incidents','go:incidents','quiet'))+incidentFacts()+`<div class="panel gap"><div class="panel-top row between wrap"><h2>Documents <span class="muted">${state.docs.length}</span></h2>${state.docs[0].id?button('View claim','go:claim','quiet'):'<button class="btn quiet" disabled title="Tag a claim document first">View claim</button>'}</div><div class="body"><div class="dropzone"><div><p>Upload incident documents</p><small>Medical bills, certificates, salary vouchers and iReport files.</small></div><label class="btn">${icon('upload')}Choose files<input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg" multiple hidden></label></div><p class="review-only" style="margin-top:8px">Demo: chosen filenames are added locally. File contents are not uploaded or stored.</p></div><div class="table-wrap"><table><thead><tr><th>File name</th><th>Claim ID</th><th>Benefit</th><th>Document type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${state.docs.map((d,i)=>`<tr><td><button class="link" data-action="tag:${i}">${escapeHtml(d.name)}</button><small>${d.date?date(d.date):'Date not tagged'}</small></td><td>${escapeHtml(d.id)||'—'}</td><td>${escapeHtml(d.benefit)||'—'}</td><td>${escapeHtml(d.type)||'—'}</td><td class="num">${d.amount?money(d.amount):'—'}</td><td>${d.id?badge(state.status):d.benefit?'<span class="muted">Supporting file</span>':badge('Needs tagging')}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>Click a file to preview and tag it.</span><span>Others = supporting evidence, no claim ID</span></div></div>`}
function tag(){const d=state.docs[state.selectedDoc];return title('Tag document',`${escapeHtml(d.name)} · Incident WC-00042`,button('Back to documents','go:documents','quiet'))+`<div class="split"><div class="panel"><div class="panel-top row between"><h2>Document preview</h2><small>Page 1 of 1</small></div><div class="doc-stage"><article class="paper"><small>SYNTHETIC DOCUMENT · FOR DESIGN REVIEW</small><h2 style="margin-top:22px">${state.selectedDoc===0?'Riverside Medical Centre':'Supporting document'}</h2><p class="muted">${state.selectedDoc===0?'Medical services · Sample invoice':escapeHtml(d.name)}</p><h3>${state.selectedDoc===0?'Invoice 0891':'Document details'}</h3><div class="row between" style="margin-top:14px"><span>Patient<br><strong>${escapeHtml(state.employee)}</strong></span><span>Date<br><strong>12 Sep 2026</strong></span></div><table><thead><tr><th>Description</th><th class="right">Amount</th></tr></thead><tbody><tr><td>Medical consultation</td><td class="right">120.00</td></tr><tr><td>Treatment and medication</td><td class="right">180.00</td></tr></tbody></table><div class="total">Total &nbsp; <strong>S$ 300.00</strong></div><p class="muted" style="margin-top:50px">Sample content only. No real patient or provider information.</p></article></div></div><form id="tag-form" class="panel"><div class="panel-top"><h2>Document details</h2></div><div class="body"><div class="fields">${field('Document type <span class="required">*</span>',select('type',['Medical Bill','Medical Certificate','Salary Voucher','MOM I-Report','Medical Report','Contractual Agreement','Death Certificate','Employment Pass','Work Permit'],d.type||'Medical Bill'),true)}${field('Document date <span class="required">*</span>',input('date',d.date||'2026-09-12','date',true),true)}${field('Benefit type <span class="required">*</span>',select('benefit',['Medical','Temporary Disablement','Permanent Partial Disablement','Permanent Total Disablement','Death','Common Law','Others'],d.benefit||'Medical'),true)}<div class="full note" id="tag-explainer">${d.id?'Saving updates claim '+d.id+'.':'Saving a benefit other than Others creates one claim ID.'} Choose Others for supporting evidence.</div><div class="full fields" id="bill-fields">${field('Provider',input('provider','Riverside Medical Centre'))}${field('Invoice number',input('invoice','0891'))}${field('Incurred amount (SGD)',input('amount',d.amount||'300.00','number'))}</div></div></div><div class="form-footer">${button('Cancel','go:documents','quiet')}<button class="btn primary" type="submit">Save document tags</button></div></form></div>`}
function claim(){const pending=state.status==='Pending insurer approval',closed=['Settled','Rejected'].includes(state.status);let actions=pending?button('Download claim files','download','primary','download')+button('Update claim settlement','go:settlement'):closed?'':button('Pending insurer approval','mark-pending','primary')+button('Pending documents','request');return title('Claim WIC-00081',`Incident WC-00042 · ${escapeHtml(state.employee)} · Medical bill 0891.pdf`,badge(state.status))+`<div class="panel"><div class="panel-top row between wrap"><h2>Claim details</h2>${button('View document','tag:0','quiet')}</div><div class="body"><dl class="facts"><div><dt>Benefit type</dt><dd>Medical</dd></div><div><dt>Document type</dt><dd>Medical Bill</dd></div><div><dt>Document date</dt><dd>12 Sep 2026</dd></div><div><dt>Incurred amount</dt><dd class="num">${money(state.docs[0].amount||300)}</dd></div><div><dt>Provider</dt><dd>Riverside Medical Centre</dd></div><div><dt>Invoice number</dt><dd>0891</dd></div><div><dt>Uploaded by</dt><dd>Broker reviewer</dd></div><div><dt>Uploaded on</dt><dd>19 Sep 2026</dd></div></dl></div><div class="section"><div class="row between wrap"><h2 style="margin:0">Related documents to insurer</h2>${button('Change selection','go:pack','quiet')}</div>${state.docs.filter((d,i)=>i&&state.selected.has(i)).map(d=>`<div class="doc-line"><span class="row">${icon('file')}${escapeHtml(d.name)}</span><small>${escapeHtml(d.type)}</small></div>`).join('')}</div>${pending?`<div class="section"><div class="row between wrap"><div><h3>External submission</h3><p class="muted" style="margin-top:5px">${state.sent?'Recorded sent · '+date(state.sent.date)+' · '+escapeHtml(state.sent.recipient)+' · '+escapeHtml(state.sent.channel):'Sending not recorded. Download the pack and send it externally.'}</p></div>${button(state.sent?'Edit sent details':'Record sent','sent','quiet')}</div></div>`:''}${state.settlement?`<div class="section"><h2>Recorded settlement</h2><dl class="facts"><div><dt>Settled amount</dt><dd>${money(state.settlement.amount)}</dd></div><div><dt>Settlement date</dt><dd>${date(state.settlement.date)}</dd></div><div><dt>Reference</dt><dd>${escapeHtml(state.settlement.reference)}</dd></div><div><dt>Remarks</dt><dd>${escapeHtml(state.settlement.remarks)||'—'}</dd></div></dl></div>`:''}<div class="form-footer" style="justify-content:space-between"><div class="row wrap">${actions}</div><div class="row wrap">${pending?button('Undo pending insurer approval','undo','quiet'):''}${!closed?button('Reject claim','reject','danger'):''}</div></div>${inlineForm()}</div><div class="panel gap"><div class="panel-top"><h2>History</h2></div><div class="body"><ul class="history">${state.events.slice().reverse().map(e=>`<li><time>19 Sep 2026</time><div><p>${escapeHtml(e)}</p><small>Broker reviewer</small></div></li>`).join('')}<li><time>19 Sep 2026</time><div><p>Document tagged · Claim WIC-00081 created</p><small>Broker reviewer · Medical / Medical Bill</small></div></li></ul></div></div>`}
function inlineForm(){if(!state.inline)return '';let fields='';if(state.inline==='sent')fields=`<div class="fields">${field('Sent date',input('date',state.sent?.date||'2026-09-19','date',true))}${field('Recipient',input('recipient',state.sent?.recipient||'Claims team, Example Insurer','text',true))}${field('Channel',select('channel',['Email','Insurer portal','Other'],state.sent?.channel||'Email'))}${field('External reference',input('reference',state.sent?.reference||''))}</div>`;else fields=field(state.inline==='reject'?'Rejection reason':'Missing documents / remarks','<textarea name="remarks" required placeholder="Describe what is needed and why."></textarea>',true);return `<form class="inline-form" id="inline-form"><h3 style="margin-bottom:16px">${state.inline==='sent'?'Record external sending':state.inline==='reject'?'Reject claim':'Pending documents'}</h3>${fields}<div class="row" style="justify-content:flex-end;margin-top:16px">${button('Cancel','cancel-inline','quiet')}<button class="btn primary" type="submit">Save ${state.inline==='sent'?'sent details':'remarks'}</button></div></form>`}
function pack(){return title('Select insurer files','Choose the documents to include for claim WIC-00081.',button('Back to claim','go:claim','quiet'))+`<div class="panel"><div class="panel-top row between"><div><h2>Incident WC-00042</h2><p class="muted" style="margin-top:5px">${escapeHtml(state.employee)} · Example Insurer</p></div>${badge(state.status)}</div><form id="pack-form"><div class="table-wrap"><table><thead><tr><th>Include</th><th>File name</th><th>Benefit</th><th>Document type</th><th>Document date</th></tr></thead><tbody>${state.docs.map((d,i)=>`<tr><td><input class="check" type="checkbox" name="file" value="${i}" ${state.selected.has(i)?'checked':''} ${i===0?'disabled':''} aria-label="Include ${escapeHtml(d.name)}"></td><td>${escapeHtml(d.name)}${i===0?'<small>Primary claim document · Always included</small>':''}</td><td>${escapeHtml(d.benefit)||'Others'}</td><td>${escapeHtml(d.type)||'Not tagged'}</td><td>${d.date?date(d.date):'—'}</td></tr>`).join('')}</tbody></table></div><div class="body"><div class="note">Only documents from this incident are shown. Supporting files can be included in more than one claim. Earlier downloaded versions stay in the history.</div></div><div class="form-footer"><span class="muted" id="selection-count" style="margin-right:auto">${state.selected.size} files selected</span>${button('Cancel','go:claim','quiet')}<button class="btn primary" type="submit">Save selection</button></div></form></div>`}
function settlement(){return title('Update claim settlement','Record the settlement confirmed by the insurer.',button('Back to claim','go:claim','quiet'))+`<div class="panel narrow"><div class="panel-top row between"><div><h2>WIC-00081 · Medical</h2><p class="muted" style="margin-top:5px">${escapeHtml(state.employee)} · Incident WC-00042</p></div>${badge('Pending insurer approval')}</div><div class="body"><dl class="facts"><div><dt>Incurred amount</dt><dd>${money(state.docs[0].amount||300)}</dd></div><div><dt>Insurer</dt><dd>Example Insurer</dd></div></dl></div><form id="settlement-form"><div class="section"><div class="fields">${field('Settled amount (SGD) <span class="required">*</span>','<input type="number" min="0" step="0.01" name="amount" value="300.00" required>')}${field('Settlement date <span class="required">*</span>',input('date','2026-09-19','date',true))}${field('Insurer / payment reference',input('reference','EX-WIC-2026-0081'),true)}${field('Remarks','<textarea name="remarks">Settlement confirmed by insurer.</textarea>',true)}</div></div><div class="form-footer">${button('Cancel','go:claim','quiet')}<button type="submit" class="btn primary">Save settlement</button></div></form></div><div class="note gap narrow">Proposed fields for review: the reference screenshots do not show the settlement-entry form. This screen records the insurer's figures; it does not calculate compensation or send a payment.</div>`}
function settings(){return title('Company settings','Configure settings for Meridian Engineering.')+`<div class="panel"><div class="tabs"><button class="tab" data-action="existing">Entity aliases</button><button class="tab" data-action="existing">Authentication</button><button class="tab active">WICA</button></div><form id="settings-form"><div class="section row between wrap"><div><h2 style="margin-bottom:4px">WICA module</h2><p class="muted">Allow brokers to create and manage work injury incidents.</p></div><label class="switch"><input type="checkbox" name="enabled" checked>Enabled</label></div><div class="section"><h2>WICA periods</h2><div class="table-wrap"><table><thead><tr><th>Start date</th><th>End date</th><th>Label</th><th>Policy</th></tr></thead><tbody id="period-rows"><tr><td><input type="date" name="start" value="2026-01-01" aria-label="Period start date" required></td><td><input type="date" name="end" value="2026-12-31" aria-label="Period end date" required></td><td><input name="label" value="01 Jan – 31 Dec 2026" aria-label="Period label"></td><td>WIC-DEMO-2026</td></tr></tbody></table></div><div style="margin-top:16px">${button('Add period','add-period','quiet','plus')}</div></div><div class="section"><div class="fields">${field('Claim submission grace period (days)','<input name="grace" type="number" min="0" step="1" placeholder="Use existing system default">',false,'Blank uses the existing policy-year default; currently no deadline when unset.')}</div><p class="muted" style="font-size:12px;margin-top:18px">Closing intake keeps existing incidents and follow-up documents available.</p></div><div class="form-footer"><span class="saved" id="settings-saved" style="margin-right:auto"></span><button class="btn primary" type="submit">Save WICA settings</button></div></form></div>`}
function render(){navigation();document.querySelector('#screen').innerHTML=screens.map(([id,label])=>`<option value="${id}" ${state.screen===id?'selected':''}>${label}</option>`).join('');document.querySelector('#main').innerHTML=crumb()+({incidents,new:newIncident,documents,tag,claim,pack,pending:claim,settlement,settings}[state.screen])()+footer();if(state.screen==='tag')toggleBill();document.querySelector('#company-icon').innerHTML=icon('building');}
function go(screen,showcase=false){state.inline=null;if(showcase){state.docs=structuredClone(docsInitial);state.employee='Tan Jun Wei';state.settlement=null;state.selectedDoc=0;state.selected=new Set([0,1,2,3]);state.status=['pending','settlement'].includes(screen)?'Pending insurer approval':'Submitted';state.sent=false;state.events=[];if(screen==='documents'){state.docs[0].id='';state.docs[0].type='';state.docs[0].benefit=''}if(screen==='tag')state.docs[0].id='';}state.screen=screen;render();window.scrollTo(0,0);}
function notify(message){const t=document.querySelector('#toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4500)}
function toggleBill(){const f=document.querySelector('#tag-form');if(!f)return;document.querySelector('#bill-fields').hidden=f.elements.benefit.value==='Others';}
function filterRows(){const q=(document.querySelector('#search')?.value||'').toLowerCase();let count=0;document.querySelectorAll('#incident-rows tr').forEach(r=>{const pass=r.dataset.search.includes(q)&&(state.filter==='all'||(state.filter==='closed')===(r.dataset.closed==='true'));r.hidden=!pass;if(pass)count++});document.querySelector('#empty').hidden=!!count;document.querySelector('#row-count').textContent=count+' incident'+(count===1?'':'s');}
document.addEventListener('input',e=>{if(e.target.id==='search')filterRows()});
document.addEventListener('change',e=>{if(e.target.id==='screen')go(e.target.value,true);if(e.target.name==='benefit')toggleBill();if(e.target.name==='file')document.querySelector('#selection-count').textContent=(1+document.querySelectorAll('input[name=file]:checked:not(:disabled)').length)+' files selected';if(e.target.id==='file-input'){for(const f of e.target.files)state.docs.push({name:f.name,id:'',type:'',benefit:'',date:''});render();notify('Filenames added to the demo. No files were uploaded.')}});
document.addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===filter));filterRows();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('go:')){go(a.slice(3));return;}if(a.startsWith('tag:')){state.selectedDoc=Number(a.slice(4));go('tag');return;}if(a.startsWith('open:')){if(a!=='open:0'){notify('Review shortcut: opening the fully illustrated sample incident.')}go('documents');return;}switch(a){case'menu':document.querySelector('#app').classList.toggle('menu-open');break;case'existing':notify('Existing Inspro page. This review prototype covers WICA only.');break;case'reset':reset();notify('Demo reset.');break;case'mark-pending':state.status='Pending insurer approval';state.events.push('Set to Pending insurer approval');go('pending');break;case'undo':state.status='Submitted';state.events.push('Pending insurer approval undone; previous submissions retained');go('claim');break;case'request':case'reject':case'sent':state.inline=a;render();document.querySelector('.inline-form').scrollIntoView({block:'nearest',behavior:'instant'});break;case'cancel-inline':state.inline=null;render();break;case'download':{state.packVersion++;state.events.push('Sample manifest downloaded · Version '+state.packVersion);const contents='INSPro WICA — SAMPLE PACK MANIFEST\nDesign review only. No real documents are included.\nClaim: WIC-00081\nVersion: '+state.packVersion+'\n\n'+[...state.selected].map(i=>state.docs[i].name).join('\n');const url=URL.createObjectURL(new Blob([contents],{type:'text/plain'}));const link=document.createElement('a');link.href=url;link.download='WIC-00081-sample-manifest.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);render();notify('Demo manifest downloaded. Production would generate the selected ZIP files.');break;}case'add-period':{const row=document.createElement('tr');row.innerHTML='<td><input type="date" name="extraStart" value="2027-01-01" aria-label="New period start" required></td><td><input type="date" name="extraEnd" value="2027-12-31" aria-label="New period end" required></td><td><input name="extraLabel" value="01 Jan – 31 Dec 2027" aria-label="New period label"></td><td>Not linked</td>';document.querySelector('#period-rows').appendChild(row);notify('New period added to this demo.');break;}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(f.id==='new-form'){state.employee=v.employee.split(' · ')[0];state.description=v.description;state.docs=structuredClone(docsInitial);state.docs[0].id='';state.docs[0].benefit='';state.docs[0].type='';state.status='Submitted';go('documents');notify('Sample incident created. Upload or tag its documents.');}if(f.id==='tag-form'){const d=state.docs[state.selectedDoc];if(d.id&&v.benefit==='Others'){notify('This document already has a claim. Production requires an audited reclassification.');return;}Object.assign(d,{type:v.type,benefit:v.benefit,date:v.date,amount:v.benefit==='Others'?'':v.amount,id:v.benefit==='Others'?'':d.id||'WIC-'+String(81+state.selectedDoc).padStart(5,'0')});state.events.push('Document tags saved');go('documents');notify(d.id?'Tags saved · Claim '+d.id:'Saved as supporting evidence · No claim ID created');}if(f.id==='pack-form'){state.selected=new Set([0,...new FormData(f).getAll('file').map(Number)]);go('claim');notify('Related document selection saved.');}if(f.id==='settlement-form'){state.settlement=v;state.status='Settled';state.events.push('Settlement recorded · '+money(v.amount));go('claim');notify('Sample settlement recorded. No payment was sent.');}if(f.id==='inline-form'){if(state.inline==='sent'){state.sent=v;state.events.push('Sending recorded · '+v.date+' · '+v.recipient+' · '+v.channel);}else{state.status=state.inline==='reject'?'Rejected':'Pending documents';state.events.push(state.status+' · '+v.remarks);}go('claim');notify('Sample record updated.');}if(f.id==='settings-form'){if(v.end<v.start){notify('End date must be on or after start date.');return;}document.querySelector('#settings-saved').textContent='Saved in this demo';notify('Settings reviewed locally. No live company settings changed.');}});
window.reviewScreen=(name)=>go(name,true);reset();
</script>
