# Gitleaks config for Inspro — extends the default ruleset, then allowlists a
# small set of values that are provably NOT secrets.
[extend]
useDefault = true

[allowlist]
description = "Provably-non-secret values: public Azure built-in RBAC role GUIDs (documented by Microsoft, referenced by infra/bicep), and synthetic test-fixture PEM keys whose body is a 1–6 char placeholder (never a real key)."
regexes = [
  # "Key Vault Secrets User" — https://learn.microsoft.com/azure/role-based-access-control/built-in-roles
  '''4633458b-17de-408a-b874-0445c86b69e6''',
  # Fake service-account keys in tests (e.g. body "AAA"/"BBB"/"x"). A real PEM
  # key body is hundreds of base64 chars, so this can never match one.
  '''-----BEGIN PRIVATE KEY-----\\n\w{1,6}\\n-----END PRIVATE KEY-----''',
]
